name: build-m2-offline

# 包 2：Gradle 离线 Maven 仓库（AGP + Kotlin 插件 + Compose 依赖）
#
# 产出 gradle-m2-offline-v<ver>.tar.gz，解压使 caches/ 落到 GRADLE_USER_HOME，
# 再配 -Pandroid.aapt2FromMavenOverride 指向包 1 的 arm64 aapt2，即可离线编 KT。
#
# 包 1 = JDK + Gradle + SDK 原生件（能编纯 Java）
# 包 2 = 依赖仓库（补 AGP/Kotlin/Compose，能编 Kotlin/Compose）
#
# 关键：必须用「真工程」跑一次 assembleDebug。
# 空跑不解析传递依赖，缓存里没有实际 jar，用户拿到照旧编不了。
#
# ⚠ 所有多行文本（banner / mark.env / verify.sh）都放在 toolchain/stamp-m2.sh
#   里，绝不内联到 run: | 的 heredoc —— YAML 块标量遇零缩进行会当场终止，
#   导致整个 workflow 解析失败（表现为 jobs=0、run 名显示成文件路径）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '包版本号'
        required: false
        default: '1.0.0'
  push:
    paths:
      - '.github/workflows/m2-offline.yml'
      - 'probe/kotlin-app/**'
      - 'toolchain/stamp-m2.sh'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gh-gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare vars
        run: |
          set -eu
          VER="${{ github.event.inputs.version || '1.0.0' }}"
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir -p "$GRADLE_USER_HOME"

      # runner (ubuntu-24.04) 已预装 Android SDK，无需再跑 setup-android@v3。
      # 那个 action 内部会执行 `sdkmanager "tools"`，但 runner 预装的
      # cmdline-tools 16.0 已经把 `tools` 这个旧包名移除了，
      # 于是报 "Warning: Failed to find package 'tools'" + exit code 1，
      # 整条流水线当场挂掉 —— 与我们的工具链无关，纯属那个 action 过时。
      #
      # 这里只补装平台与 build-tools，并且全部用 `|| true` 兜底：
      # 真正的 android.jar / aapt2 我们自带（见下一个 step），
      # sdkmanager 只是为了让 lint / 资源处理有目录可写，失败不影响结果。
      - name: Ensure SDK platform (best effort)
        run: |
          set -u
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" 2>/dev/null || true
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 已预装则不重复下载；失败也放行，后面有自带的 android.jar 兜着
          "$SDKMANAGER" "platforms;android-37" > /dev/null 2>&1 || \
          "$SDKMANAGER" "platforms;android-36" > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;36.0.0" > /dev/null 2>&1 || true
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Place android.jar fallback
        run: |
          set -eu
          # runner 不一定预装 android-37。仓库里带了 43MB 的 android.jar
          # （与包 1 同源），缺平台时补一份过去，保证 AGP 有 android.jar 可读。
          P="$ANDROID_HOME/platforms/android-37"
          if [ ! -f "$P/android.jar" ]; then
            echo "android-37 missing at runner, installing our own"
            mkdir -p "$P"
            cp toolchain/android.jar "$P/android.jar"
            # 最小 package.xml，让 AGP 认得这是一个合法平台目录
            printf '<ns2:repository xmlns:ns2="http://schemas.android.com/repository/android/common/02" xmlns:ns3="http://schemas.android.com/repository/android/generic/02"><license id="android-sdk-license" type="text">$ANDROID_SDK_LICENSE</license><localPackage path="platforms;android-37" obsolete="false"><type-details xsi:type="ns3:genericDetailsType" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"/><revision><major>37</major></revision><display-name>Android SDK Platform 37</display-name></localPackage></ns2:repository>' > "$P/package.xml" 2>/dev/null || true
          else
            echo "android-37 already present on runner"
          fi
          ls -l "$P" 2>/dev/null || true

      - name: Verify arm64 aapt2 availability (record only)
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 -o sdk-tools.zip \
            "https://github.com/lzhiyong/android-sdk-tools/releases/download/35.0.2/android-sdk-tools-static-aarch64.zip"
          unzip -q sdk-tools.zip -d sdk-tools
          AAPT2="$RUNNER_TEMP/sdk-tools/build-tools/aapt2"
          # 只做「形态记录」：它是 ELF 还是脚本、e_machine 是多少。
          MAGIC=$(head -c 4 "$AAPT2" | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC" = "7f454c46" ]; then
            M=$(head -c 20 "$AAPT2" | od -An -tx1 | tr -d ' \n' | cut -c35-38)
            echo "aapt2 is ELF, e_machine=0x$M (aarch64 = 00b7)"
          else
            echo "aapt2 is NOT an ELF (magic=$MAGIC) — 可能是脚本包装器"
            echo "这解释了上一轮为什么在 x86_64 runner 上报 Syntax error"
          fi
          # 这份文件**不参与构建**，只在日志里留证。真正给手机的 arm64 aapt2
          # 由包 1 提供，包 2 不携带任何可执行二进制。

      # ⚠ 这里刻意 **不** 注入 arm64 aapt2。
      #
      # 上一版尝试把 arm64 aapt2 塞给 x86_64 runner，结果：
      #   aapt2: 92: Syntax error: "(" unexpected
      # 架构不可跨：arm64 二进制永远不能在 x86_64 上直接跑。
      #
      # 正确分工：
      #   · CI 用 runner 自带的 x86_64 aapt2 完成构建 —— 目的只是把
      #     AGP / Kotlin / Compose 的**依赖 jar** 解析下来；
      #   · 打包前把 aapt2 从缓存里整个删掉 —— 它本来就是「按架构分发」的，
      #     手机端由包 1 提供 arm64 版，不需要从 Maven 缓存拿。
      # 这样包 2 是纯 JVM artifact，跨架构安全。
      - name: Warm up with a real build
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 -o gradle.zip \
            "https://services.gradle.org/distributions/gradle-9.6.0-bin.zip"
          EXPECT="bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
          ACTUAL=$(sha256sum gradle.zip | cut -d' ' -f1)
          echo "gradle sha256=$ACTUAL"
          [ "$ACTUAL" = "$EXPECT" ] || { echo "SHA MISMATCH"; exit 1; }
          unzip -q gradle.zip
          chmod 755 "$RUNNER_TEMP/gradle-9.6.0/bin/gradle"
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" --version

          cd "${{ github.workspace }}/probe/kotlin-app"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" --no-daemon --stacktrace \
            assembleDebug
        timeout-minutes: 30

      - name: Report resolved artifacts
        run: |
          set -eu
          CD="$GRADLE_USER_HOME/caches/modules-2/files-2.1"
          echo "=== modules-2 size ==="
          du -sb "$GRADLE_USER_HOME/caches/modules-2" || true
          echo "=== key artifacts ==="
          for pat in \
            'com.android.tools.build/gradle/9.4.0' \
            'com.android.tools.build/aapt2' \
            'org.jetbrains.kotlin/kotlin-compiler-embeddable' \
            'org.jetbrains.kotlin/kotlin-gradle-plugin' \
            'androidx.compose.material3' \
            'androidx.compose.runtime' \
            'androidx.compose.ui'; do
            if find "$CD" -path "*$pat*" -type f | head -1 | grep -q .; then
              echo "  OK   $pat"
            else
              echo "  MISS $pat"
            fi
          done

      - name: Purge architecture-specific artifacts
        run: |
          set -eu
          CD="$GRADLE_USER_HOME/caches/modules-2/files-2.1"
          echo "=== 缓存里所有可执行/架构相关件 ==="
          find "$CD" -name '*.so' 2>/dev/null | head -20 || true
          find "$CD" -path '*aapt2*' -type f 2>/dev/null | head -20 || true

          # aapt2 是 AGP 唯一的架构相关依赖：
          #   com.android.tools.build:aapt2:<ver>-linux       → x86_64 (ELF/脚本)
          #   com.android.tools.build:aapt2:<ver>-linux-aarch64 → arm64 (给手机用)
          # 包 2 的作用是「依赖仓库」，而手机端的 aapt2 由包 1 提供，
          # 所以这里把整个 aapt2 分组删干净 —— 避免把 x86_64 带给手机，
          # 也避免用户误以为包 2 里那个能跑。
          #
          # 注意：删掉它不影响用户构建，因为 AGP 会用
          # -Pandroid.aapt2FromMavenOverride 指向包 1 的 arm64 aapt2。
          if [ -d "$CD/com.android.tools.build/aapt2" ]; then
            echo "=== 删除 aapt2 分组（架构相关，由包 1 提供）==="
            du -sb "$CD/com.android.tools.build/aapt2" || true
            rm -rf "$CD/com.android.tools.build/aapt2"
          fi
          echo "=== 清理后确认 ==="
          find "$CD" -name '*.so' 2>/dev/null | head -10 || true
          echo "remaining aapt2 dirs: $(find "$CD" -path '*aapt2*' -type d 2>/dev/null | wc -l)"

      - name: Stamp
        run: |
          set -eu
          C="$RUNNER_TEMP/out/gradle-m2-offline"
          mkdir -p "$C"
          cp -a "$GRADLE_USER_HOME/caches" "$C/"
          sh toolchain/stamp-m2.sh "$C" "$VER"
          du -sb "$C"

      - name: Package
        run: |
          set -eu
          cd "$RUNNER_TEMP/out"
          tar cf gradle-m2-offline-v"$VER".tar gradle-m2-offline
          gzip -1 gradle-m2-offline-v"$VER".tar
          ls -l gradle-m2-offline-v"$VER".tar.gz
          sha256sum gradle-m2-offline-v"$VER".tar.gz | tee gradle-m2-offline-v"$VER".tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-m2-offline-v${{ env.VER }}
          path: |
            ${{ runner.temp }}/out/gradle-m2-offline-v*.tar.gz
            ${{ runner.temp }}/out/gradle-m2-offline-v*.tar.gz.sha256
          retention-days: 14
          compression-level: 0

      # ---------- 发版：与包 1 同一个 Release，一次给用户两件 ----------
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: toolchain-v${{ env.VER }}
          name: Gradle aarch64 Toolchain v${{ env.VER }}
          body: |
            AgentPad 自建 aarch64 Android 构建工具链（两包制）

            ## 包 1 · gradle-toolchain-arm64
            JDK 17.0.21+9 + Gradle 9.6.0 + build-tools 36.0.0(aarch64 原生)
            + platforms/android-37 + platform-tools
            → **能编纯 Java Android 工程**

            ## 包 2 · gradle-m2-offline
            Gradle 离线依赖仓库：AGP 9.4.0 + Kotlin 2.4.21 插件
            + Compose BOM 2026.09.00 + androidx 全链
            → 叠加包 1 后 **能编 Kotlin / Compose 工程**

            ### 用法
            1. 两个包都解压，包 2 的 `caches/` 放进包 1 的 `GRADLE_USER_HOME`
            2. `-Pandroid.aapt2FromMavenOverride` 指向包 1 的 arm64 aapt2
            3. `gradle --offline assembleDebug`

            包 2 不含任何可执行二进制（aapt2 已剔除，由包 1 提供），
            因此两包可跨架构安全分发。

            解压后先跑 `sh verify.sh` 自检。
          files: |
            ${{ runner.temp }}/out/gradle-m2-offline-v*.tar.gz
            ${{ runner.temp }}/out/gradle-m2-offline-v*.tar.gz.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: true