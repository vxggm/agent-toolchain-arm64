name: build-m2-offline

# 包 2：Gradle 离线 Maven 仓库（AGP + Kotlin 插件 + Compose 依赖）
#
# 产出 gradle-m2-offline-v<ver>.tar.gz，解压使 caches/ 落到 GRADLE_USER_HOME，
# 再配 -Pandroid.aapt2FromMavenOverride 指向包 1 的 arm64 aapt2，即可离线编 KT。
#
# 包 1 = JDK + Gradle + SDK 原生件（能编纯 Java）
# 包 2 = 依赖仓库（补 AGP/Kotlin/Compose，能编 Kotlin/Compose）
#
# 关键：必须用「真工程」跑一次 assembleDebug。
# 空跑不解析传递依赖，缓存里没有实际 jar，用户拿到照旧编不了。
#
# ⚠ 所有多行文本（banner / mark.env / verify.sh）都放在 toolchain/stamp-m2.sh
#   里，绝不内联到 run: | 的 heredoc —— YAML 块标量遇零缩进行会当场终止，
#   导致整个 workflow 解析失败（表现为 jobs=0、run 名显示成文件路径）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '包版本号'
        required: false
        default: '1.0.0'
  push:
    paths:
      - '.github/workflows/m2-offline.yml'
      - 'probe/kotlin-app/**'
      - 'toolchain/stamp-m2.sh'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gh-gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare vars
        run: |
          set -eu
          VER="${{ github.event.inputs.version || '1.0.0' }}"
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir -p "$GRADLE_USER_HOME"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform
        run: |
          set -eu
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" > /dev/null
        timeout-minutes: 10

      - name: Fetch arm64 aapt2 override
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 -o sdk-tools.zip \
            "https://github.com/lzhiyong/android-sdk-tools/releases/download/35.0.2/android-sdk-tools-static-aarch64.zip"
          unzip -q sdk-tools.zip -d sdk-tools
          AAPT2="$RUNNER_TEMP/sdk-tools/build-tools/aapt2"
          M=$(head -c 20 "$AAPT2" | od -An -tx1 | tr -d ' \n' | cut -c35-38)
          echo "aapt2 e_machine=0x$M (expect 00b7)"
          [ "$M" = "00b7" ] || { echo "not aarch64, abort"; exit 1; }
          chmod 755 "$AAPT2"
          echo "AAPT2_ARM64=$AAPT2" >> $GITHUB_ENV

      - name: Warm up with a real build
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 -o gradle.zip \
            "https://services.gradle.org/distributions/gradle-9.6.0-bin.zip"
          EXPECT="bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
          ACTUAL=$(sha256sum gradle.zip | cut -d' ' -f1)
          echo "gradle sha256=$ACTUAL"
          [ "$ACTUAL" = "$EXPECT" ] || { echo "SHA MISMATCH"; exit 1; }
          unzip -q gradle.zip
          chmod 755 "$RUNNER_TEMP/gradle-9.6.0/bin/gradle"
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" --version

          cd "${{ github.workspace }}/probe/kotlin-app"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" --no-daemon --stacktrace \
            -Pandroid.aapt2FromMavenOverride="$AAPT2_ARM64" \
            assembleDebug
        timeout-minutes: 30

      - name: Report resolved artifacts
        run: |
          set -eu
          CD="$GRADLE_USER_HOME/caches/modules-2/files-2.1"
          echo "=== modules-2 size ==="
          du -sb "$GRADLE_USER_HOME/caches/modules-2" || true
          echo "=== key artifacts ==="
          for pat in \
            'com.android.tools.build/gradle/9.4.0' \
            'com.android.tools.build/aapt2' \
            'org.jetbrains.kotlin/kotlin-compiler-embeddable' \
            'org.jetbrains.kotlin/kotlin-gradle-plugin' \
            'androidx.compose.material3' \
            'androidx.compose.runtime' \
            'androidx.compose.ui'; do
            if find "$CD" -path "*$pat*" -type f | head -1 | grep -q .; then
              echo "  OK   $pat"
            else
              echo "  MISS $pat"
            fi
          done

      - name: Purge non-aarch64 natives
        run: |
          set -eu
          CD="$GRADLE_USER_HOME/caches/modules-2/files-2.1"
          echo "=== .so files found ==="
          find "$CD" -name '*.so' 2>/dev/null | head -20 || true
          REMOVED=0
          for d in "$CD"/com.android.tools.build/aapt2/*/; do
            [ -d "$d" ] || continue
            case "$(basename "$d")" in
              *-linux|*-osx|*-windows)
                echo "  purge $(basename "$d")"
                rm -rf "$d"
                REMOVED=$((REMOVED+1))
                ;;
            esac
          done
          echo "purged $REMOVED dirs"

      - name: Stamp
        run: |
          set -eu
          C="$RUNNER_TEMP/out/gradle-m2-offline"
          mkdir -p "$C"
          cp -a "$GRADLE_USER_HOME/caches" "$C/"
          sh toolchain/stamp-m2.sh "$C" "$VER"
          du -sb "$C"

      - name: Package
        run: |
          set -eu
          cd "$RUNNER_TEMP/out"
          tar cf gradle-m2-offline-v"$VER".tar gradle-m2-offline
          gzip -1 gradle-m2-offline-v"$VER".tar
          ls -l gradle-m2-offline-v"$VER".tar.gz
          sha256sum gradle-m2-offline-v"$VER".tar.gz | tee gradle-m2-offline-v"$VER".tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-m2-offline-v${{ env.VER }}
          path: |
            ${{ runner.temp }}/out/gradle-m2-offline-v*.tar.gz
            ${{ runner.temp }}/out/gradle-m2-offline-v*.tar.gz.sha256
          retention-days: 14
          compression-level: 0